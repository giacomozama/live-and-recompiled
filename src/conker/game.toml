[data]
# proven from Conker's own inlined D3D8LTCG code (tools/xbe_disasm.py):
#   SetTextureStageState writes [0x547330 + stage*0x80 + field*4]  -> stage state table [4][32]
#     (0x5473A0, which the signature scan reported, is stage*0x80 + TEXCOORDINDEX (field 28*4),
#      NOT the table base; the sibling bodies at 0x537B2D/0x537B7B/0x537BC7 write the same base)
#   SetTexture/SetPixelShader or [0x5499F0],0x4800       -> dirty flags
#   SetIndices writes [0x54A898]                         -> index data base
#   SetStreamSource (0x535F00) writes [0x547158 + n*12]  -> stream table
#   SetPixelShader rep movsd 0x39 dwords to 0x5499F8     -> render state shadow [166]
D3D_DeferredTextureState    = 0x547330
D3D_Device                  = 0x547540
# the library's FVF vertex shader object: SetVertexShader points device->vs (CDevice+0x794) at it when the
# handle is a plain FVF. The runtime skips that body (it HLEs SetVertexShader), so it points the device at
# this object itself; library internals that guard on its flags then find a valid (zeroed) object
D3D_FvfShader               = 0x547040
# The library's own device init (miniport at device+0x1C28 + NV2A bring-up) does real hardware waits the
# runtime cannot answer, so it is NOT run; the internals that need it are host-replaced in src/conker/game/hooks.cpp.
# D3D_DeviceInit            = 0x53E5D0
# D3D_InitSize0             = 0x54A8B8
# D3D_InitSize1             = 0x54A8BC
D3D_DirtyFlags              = 0x5499F0
D3D_IndexData               = 0x54A898
D3D_pDevice                 = 0x5499E8
D3D_RenderState             = 0x5499F8
# Conker's library computes the render state method arithmetically (no table); this SDK build never reads
# the symbol, so it only has to be non-zero for XDK_REQUIRE. Point it at the state shadow.
D3D_SimpleRenderStateEncode = 0x5499F8
# Conker's SetStreamSource (0x535F00) stores stride at [n*12 + 0x547158] and the vertex buffer at
# [n*12 + 0x547160], so the table base is 0x547158; 0x547160 (which the scan reported) is entry 0's buffer
# field. With the wrong base the runtime's SetStreamSource HLE overwrote slot 0's buffer with the stride.
D3D_Streams                 = 0x547158
DSound_StreamVtable         = 0x586038
DSound_StreamVtable2        = 0x586028
XPP_GamepadType             = 0x558454
XPP_MemoryUnitType          = 0x5583D8

# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
# proven by hand from the disassembly of each function in this xbe (tools/xbe_disasm.py), in the host's API
# argument order. Conker's D3D8LTCG passes some arguments in registers, unlike the reference titles.
[abi]
CDevice_KickOff = ["edx"]
D3DDevice_DrawVertices = ["stack", "ecx", "eax"]  # (PrimitiveType, StartVertex=e?c, VertexCount=e?ax)
D3DDevice_GetVertexShaderFunction = ["edx", "eax", "ecx"]  # (shader object, pData, pSizeOfData)
D3DDevice_SelectVertexShader = ["eax", "ebx"]  # (Handle, Address)
D3DDevice_SetIndices = ["ebx", "stack"]  # (pIndexData, BaseVertexIndex)
D3DDevice_SetPixelShader = ["eax"]
D3DDevice_SetPixelShaderConstant = ["ecx", "stack", "eax"]  # (Register, pConstantData, ConstantCount)
D3DDevice_SetShaderConstantMode = ["eax"]
D3DDevice_SetStreamSource = ["eax", "ebx", "stack"]  # (StreamNumber, pStreamData, Stride)
D3DDevice_SetTexture = ["eax", "stack"]  # (Stage, pTexture)
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]  # (Stage, Value)
D3DDevice_SetTransform = ["eax", "edx"]  # (State, pMatrix)
D3DDevice_Swap = ["eax"]
D3DResource_IsBusy = ["ecx"]
D3D_InternalRelease = ["esi"]
D3D_MakeRequestedSpace = ["eax", "stack"]  # (Size, ...)
# LTCG drops Adapter/DeviceType/hFocusWindow here: flags in eax, pPresentationParameters on the stack,
# ppReturnedDeviceInterface in ecx; a[0..2] are unused by the host so they borrow free registers.
Direct3D_CreateDevice = ["ebx", "edx", "esi", "eax", "stack", "ecx"]

# frame rate and aspect patches (src/conker/game/display.cpp)
[[hook]]
at = 0x2A7CBC  # frame timer: the frame's ticks from the time it took, above 30 FPS
call = "ConkerFrameTicks"

[[hook]]
at = 0x64468   # camera projection: its aspect widened to the display's (Hor+)
call = "ConkerCameraAspect"

[[hook]]
at = 0xD9AAF   # a character effect's draw: what it pushes tagged as the effect's, for frame generation (tags.cpp)
call = "ConkerEffectDraw"

[[hook]]
at = 0xD9AB1   # after it: the tag before
call = "ConkerEffectDrawn"

[[hook]]
at = 0x40935F  # a shadow's receiver: what it draws tagged as the shadow's, for frame generation (tags.cpp)
call = "ConkerShadowReceiverDraw"

[[hook]]
at = 0x409364  # after it: the tag before
call = "ConkerShadowReceiverDrawn"

[[hook]]
at = 0x1A95DD  # grass patch: drawn as a near one, or however far (grass::g_max_lod, g_fade)
call = "ConkerGrassNear"

[[hook]]
at = 0x8210C   # fur shells: a distant object's count as at the near range's edge (fur::g_distant)
call = "ConkerFurDistant"

[[hook]]
at = 0x7F452   # a player's model: the full one however far (characters::g_max_lod)
call = "ConkerCharacterLod"

[[hook]]
at = 0x1310EF  # a player's refresh pacing: a whole share each frame (characters::g_max_lod)
call = "ConkerCharacterPace"

[[hook]]
at = 0x131129  # and no cap of 4 players a frame on it
call = "ConkerCharacterPaceCount"

[[hook]]
at = 0x1A968F  # grass patch: all its blades, solid (grass::g_max_lod, g_fade)
call = "ConkerGrassFull"

[[hook]]
at = 0x2D5662  # a character's script timer +0x214: counted in console frames, not frames (the alien's punch window)
call = "ConkerScriptTimer"
on_true = 0x2D5674

[[hook]]
at = 0x158E38  # the rope's step: a weighted chain in substeps of the frame instead of the console's pass (rope::g_physics)
call = "ConkerRopeStep"
on_true = 0x15919D
