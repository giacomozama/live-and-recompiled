[data]
# proven from Conker's own inlined D3D8LTCG code (tools/xbe_disasm.py):
#   SetTextureStageState writes [0x547330 + stage*0x80 + field*4]  -> stage state table [4][32]
#     (0x5473A0, which the signature scan reported, is stage*0x80 + TEXCOORDINDEX (field 28*4),
#      NOT the table base; the sibling bodies at 0x537B2D/0x537B7B/0x537BC7 write the same base)
#   SetTexture/SetPixelShader or [0x5499F0],0x4800       -> dirty flags
#   SetIndices writes [0x54A898]                         -> index data base
#   SetStreamSource (0x535F00) writes [0x547158 + n*12]  -> stream table
#   SetPixelShader rep movsd 0x39 dwords to 0x5499F8     -> render state shadow [166]
D3D_DeferredTextureState    = 0x547330
D3D_Device                  = 0x547540
# the library's FVF vertex shader object: SetVertexShader points device->vs (CDevice+0x794) at it when the
# handle is a plain FVF. The runtime skips that body (it HLEs SetVertexShader), so it points the device at
# this object itself; library internals that guard on its flags then find a valid (zeroed) object
D3D_FvfShader               = 0x547040
# The library's own device init (miniport at device+0x1C28 + NV2A bring-up) does real hardware waits the
# runtime cannot answer, so it is NOT run; the internals that need it are host-replaced in src/conker/game/hooks.cpp.
# D3D_DeviceInit            = 0x53E5D0
# D3D_InitSize0             = 0x54A8B8
# D3D_InitSize1             = 0x54A8BC
D3D_DirtyFlags              = 0x5499F0
D3D_IndexData               = 0x54A898
D3D_pDevice                 = 0x5499E8
D3D_RenderState             = 0x5499F8
# Conker's library computes the render state method arithmetically (no table); this SDK build never reads
# the symbol, so it only has to be non-zero for XDK_REQUIRE. Point it at the state shadow.
D3D_SimpleRenderStateEncode = 0x5499F8
# Conker's SetStreamSource (0x535F00) stores stride at [n*12 + 0x547158] and the vertex buffer at
# [n*12 + 0x547160], so the table base is 0x547158; 0x547160 (which the scan reported) is entry 0's buffer
# field. With the wrong base the runtime's SetStreamSource HLE overwrote slot 0's buffer with the stride.
D3D_Streams                 = 0x547158
DSound_StreamVtable         = 0x586038
DSound_StreamVtable2        = 0x586028
XPP_GamepadType             = 0x558454
XPP_MemoryUnitType          = 0x5583D8

# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
# proven by hand from the disassembly of each function in this xbe (tools/xbe_disasm.py), in the host's API
# argument order. Conker's D3D8LTCG passes some arguments in registers, unlike the reference titles.
[abi]
CDevice_KickOff = ["edx"]
D3DDevice_DrawVertices = ["stack", "ecx", "eax"]  # (PrimitiveType, StartVertex=e?c, VertexCount=e?ax)
D3DDevice_GetVertexShaderFunction = ["edx", "eax", "ecx"]  # (shader object, pData, pSizeOfData)
D3DDevice_SelectVertexShader = ["eax", "ebx"]  # (Handle, Address)
D3DDevice_SetIndices = ["ebx", "stack"]  # (pIndexData, BaseVertexIndex)
D3DDevice_SetPixelShader = ["eax"]
D3DDevice_SetPixelShaderConstant = ["ecx", "stack", "eax"]  # (Register, pConstantData, ConstantCount)
D3DDevice_SetShaderConstantMode = ["eax"]
D3DDevice_SetStreamSource = ["eax", "ebx", "stack"]  # (StreamNumber, pStreamData, Stride)
D3DDevice_SetTexture = ["eax", "stack"]  # (Stage, pTexture)
D3DDevice_SetTextureState_TexCoordIndex = ["esi", "stack"]  # (Stage, Value)
D3DDevice_SetTransform = ["eax", "edx"]  # (State, pMatrix)
D3DDevice_Swap = ["eax"]
D3DResource_IsBusy = ["ecx"]
D3D_InternalRelease = ["esi"]
D3D_MakeRequestedSpace = ["eax", "stack"]  # (Size, ...)
# LTCG drops Adapter/DeviceType/hFocusWindow here: flags in eax, pPresentationParameters on the stack,
# ppReturnedDeviceInterface in ecx; a[0..2] are unused by the host so they borrow free registers.
Direct3D_CreateDevice = ["ebx", "edx", "esi", "eax", "stack", "ecx"]

# frame rate and aspect patches (src/conker/game/display.cpp)
[[hook]]
at = 0x2A7CBC  # frame timer: the frame's ticks from the time it took, above 30 FPS
call = "ConkerFrameTicks"

[[hook]]
at = 0x64468   # camera projection: its aspect widened to the display's (Hor+)
call = "ConkerCameraAspect"

[[hook]]
at = 0x2A3FFF  # the frame's drawing: paused, the picture kept before the pause instead of the game drawn again (pause_picture.cpp)
call = "ConkerPauseFrame"
on_true = 0x2A4497

[[hook]]
at = 0x202B6B  # the frontend picture frame's camera: its fixed 4:3 aspect widened to the display's
call = "ConkerFrontendFrameAspect"

[[hook]]
at = 0x64471   # its tail jump to 0x645C0: the vertical field of view scaled by the fov setting, in play only
call = "ConkerCameraFov"

[[hook]]
at = 0x4793E   # far third person camera: its distance from the pitch's share of the console's range (look_up)
call = "ConkerFarCameraCeiling"

[[hook]]
at = 0xD9AAF   # a character effect's draw: what it pushes tagged as the effect's, for frame generation (tags.cpp)
call = "ConkerEffectDraw"

[[hook]]
at = 0xD9AB1   # after it: the tag before
call = "ConkerEffectDrawn"

[[hook]]
at = 0x40935F  # a shadow's receiver: what it draws tagged as the shadow's, for frame generation (tags.cpp)
call = "ConkerShadowReceiverDraw"

[[hook]]
at = 0x409364  # after it: the tag before
call = "ConkerShadowReceiverDrawn"

[[hook]]
at = 0x1A95DD  # grass patch: drawn as a near one, or however far (grass::g_max_lod, g_fade)
call = "ConkerGrassNear"

[[hook]]
at = 0x56AD4   # cutscene speech: a line flagged "no bubble in English" (the throne monologues) gets its bubble
call = "ConkerEnglishBubble"  # (cutscenes::g_english_bubbles, src/conker/game/hooks.cpp)

[[hook]]
at = 0x8210C   # fur shells: a distant object's count as at the near range's edge (fur::g_distant)
call = "ConkerFurDistant"

[[hook]]
at = 0x82071   # fur shells: Beach Bloodbath's soldiers' cut to 4 shells at half length undone (fur::g_distant)
call = "ConkerFurBeach"

[[hook]]
at = 0x80358   # a player's fur shells: the alpha test the object path sets, not the draw before's;
               # who is drawn, for super fur's looks (fur::TagShells)
call = "ConkerFurAlphaTest"

[[hook]]
at = 0x78460   # an object's fur shells: who is drawn, for super fur's looks (fur::TagShells)
call = "ConkerFurTag"

[[hook]]
at = 0x7F452   # a player's model: the full one however far (characters::g_max_lod)
call = "ConkerCharacterLod"

[[hook]]
at = 0x2B3368  # a player's setup, its animation handed to its models: a class's menu model in slot 0 (characters::g_menu_models)
call = "ConkerMenuSkeleton"

[[hook]]
at = 0x1F05D0  # the game's out of memory error, which reboots it: the size, tag and GPU heap logged
call = "ConkerOutOfMemory"

[[hook]]
at = 0x2F58D2  # a player's teardown, its models about to be released (0x2B4310): its menu model's instance and scene copy first (characters::g_menu_models)
call = "ConkerMenuRelease"

[[hook]]
at = 0x636AF   # a package taken by the level load: a class's, its character select model too (characters::g_menu_models)
call = "ConkerMenuPackages"

[[hook]]
at = 0x2B428E  # an actor's type model asked for (0x99CF0's status in eax): a type no file or package has goes without an instance (issue #15)
call = "ConkerActorModelAsked"

[[hook]]
at = 0x7FC6E   # a player's draw, its effect passes chosen: the character select model swapped into slot 0 for it, unless cloaked or shielded (characters::g_menu_models)
call = "ConkerMenuEffects"

[[hook]]
at = 0x805A6   # the draw's end: the match model back in slot 0
call = "ConkerMenuEffectsEnd"

[[hook]]
at = 0x7F5AB   # a player's kind 8 pass (the helmet shine, 0x82730 on slot 0's model): the character select model swapped in (characters::g_menu_models)
call = "ConkerMenuShine"

[[hook]]
at = 0x7F709   # the kind 8 pass's end: the match model back in slot 0
call = "ConkerMenuShineEnd"

[[hook]]
at = 0x801A2   # a player's see-through pieces: the Tediz Poisoner's character select helmet drawn solid
call = "ConkerSolidHelmet"

[[hook]]
at = 0x801B7   # after them
call = "ConkerSolidHelmetEnd"

[[hook]]
at = 0x2A9852  # a level's start, its instance and frontend lists about to be emptied: the menu models' nodes kept (characters::g_menu_models)
call = "ConkerMenuKeepList"

[[hook]]
at = 0x2A9870  # after: the frontend list put back, released at the next level change
call = "ConkerMenuKeptList"

[[hook]]
at = 0x8643D   # a level change, its frontend packages released: those asked for with them (characters::g_menu_models)
call = "ConkerMenuReset"

[[hook]]
at = 0x1310EF  # a player's refresh pacing: a whole share each frame (characters::g_max_lod)
call = "ConkerCharacterPace"

[[hook]]
at = 0x131129  # and no cap of 4 players a frame on it
call = "ConkerCharacterPaceCount"

[[hook]]
at = 0x1A968F  # grass patch: all its blades, solid (grass::g_max_lod, g_fade)
call = "ConkerGrassFull"

[[hook]]
at = 0x2D5662  # a character's script timer +0x214: counted in console frames, not frames (the alien's punch window)
call = "ConkerScriptTimer"
on_true = 0x2D5674

[[hook]]
at = 0x2D511E  # a swimmer above the surface's height: cut as the console's two-tick frames would leave him, not 0.35 a frame
call = "ConkerSwimSurface"

[[hook]]
at = 0x2EBB36  # an airborne character's vertical substeps: the console's count a two-tick frame, spread over its ticks (Heist's slow-mo dive)
call = "ConkerAirSubsteps"

[[hook]]
at = 0x2ED78E  # a grounded character's speed drag: 0.9 a console frame of two ticks, not 0.9 a frame (the beetles' half pace at 60)
call = "ConkerGroundDrag"

[[hook]]
at = 0x2A331F  # a collision's lift out of a floor: its sideways part a console frame's, not a frame's (the beetles shoved back up their stumps at 60)
call = "ConkerCollisionLift"

[[hook]]
at = 0x708B2  # a chocolate pickup's bob: its height is a whole number, the fraction goes to the float offset the matrix adds
call = "ConkerChocoBob"

[[hook]]
at = 0x2A4471  # the cutscene censor box's move: its velocity is a console frame's, spread over the frame's ticks
call = "ConkerCensorMove"

[[hook]]
at = 0x312FAB  # a weapon mode's measured speed: a frame of one tick counts its distance as two (walk or run, clip speed)
call = "ConkerWeaponWalkSpeed"

[[hook]]
at = 0x158E38  # the rope's step: a weighted chain in substeps of the frame instead of the console's pass (rope::g_physics)
call = "ConkerRopeStep"
on_true = 0x15919D

# multiplayer menus without Xbox Live (src/conker/game/menus.cpp)
[[hook]]
at = 0x23605A  # frontend multiplayer menu: its cursor back on System Link, one up for Xbox Live gone
after = true
call = "ConkerMpMenuCursor"

[[hook]]
at = 0x23607F  # and back on Xbox Live or Dumbots
after = true
call = "ConkerMpMenuCursor"

[[hook]]
at = 0x1F8CEC  # match pause menu, main page: Options in Xbox Live's place
call = "ConkerPauseItems"

[[hook]]
at = 0x1F8DEB  # its A: Options opens the settings menu, the rest past the Xbox Live test (Controller its page)
call = "ConkerPauseOptions"
on_true = 0x1F8E97
on_false = 0x1F8E1C

[[hook]]
at = 0x23A2DE  # Online menu: its items with Options after them
after = true
call = "ConkerOnlineItems"

[[hook]]
at = 0x240517  # an item list's handler call: the Online menu's Options opens the settings menu instead
call = "ConkerOnlineOptions"
on_true = 0x24051A

[[hook]]
at = 0x20D4F9  # a menu list's item text: the glyphs that follow are its, for the mouse
call = "ConkerListItem"

[[hook]]
at = 0x20D4FE  # after it: the list shown once its last item is
call = "ConkerListItemDrawn"

[[hook]]
at = 0x3D343A  # a glyph placed, before its clip test: into the item's rect
call = "ConkerListGlyph"

[[hook]]
at = 0x2175B2  # a panel quad sent: the list's texture on the screen, for the mouse
call = "ConkerPanelQuad"

[[hook]]
at = 0x216D4D  # a multiplayer menu's page hints drawn ("R Configure"): the menu title's alpha, so they read
call = "ConkerPageHintAlpha"

[[hook]]
at = 0x3D3981  # a glyph's quad sent: the quit prompt's Yes and No, for the mouse
call = "ConkerTextQuad"

[[hook]]
at = 0x1D40A8  # 0x1D3CB0: the target's colour by team just picked, in the chosen team colours (player_tags.cpp)
call = "ConkerTargetColour"

[[hook]]
at = 0x1CC5FC  # 0x1CC500, a sprite by name: a team icon's texture in the chosen team colours (player_tags.cpp)
call = "ConkerTeamIcon"

[[hook]]
at = 0x1EC84E  # 0x1EC7F0, the squirrels' flag held: its colour (esi) in the chosen team colours (player_tags.cpp)
call = "ConkerFlagColour"

[[hook]]
at = 0x1EC8CE  # 0x1EC870, the Tediz' flag held: its colour (esi) in the chosen team colours (player_tags.cpp)
call = "ConkerFlagColour"

[[hook]]
at = 0x34822F  # 0x347330, the flag over its carrier: its colour by team in the chosen team colours (player_tags.cpp)
call = "ConkerCarrierFlag"

[[hook]]
at = 0x34935E  # 0x348FB0, a health bar's fill corners made: flattened for one drawn across with no name (player_tags.cpp)
call = "ConkerBarFill"

[[hook]]
at = 0x34970E  # 0x348FB0, a health bar's frame corners made: its place on screen kept, then flattened (player_tags.cpp)
call = "ConkerBarFrame"

[[hook]]
at = 0x1ED983  # 0x1ECF40, the message log drawn: its colour table's green and red in the chosen team colours (player_tags.cpp)
call = "ConkerMessageColours"

[[hook]]
at = 0x203CE9  # the quit prompt's A: the word the mouse clicked
call = "ConkerQuitChoice"

# a frontend option row's trigger icons as the move left / right keys (menus.cpp TriggerIcon)
[[hook]]
at = 0x20C7D8  # 0x1F5310 returned: LT's icon drawn next
call = "ConkerTriggerIconL"

[[hook]]
at = 0x20C7EB  # drawn
call = "ConkerTriggerIconDone"

[[hook]]
at = 0x20C84D  # 0x1F53B0 returned: RT's icon drawn next
call = "ConkerTriggerIconR"

[[hook]]
at = 0x20C860  # drawn
call = "ConkerTriggerIconDone"

# 0x15D280's screen quad, DrawVerticesUP: redrawn HUD art drawn larger (hud_art.cpp)
[[hook]]
at = 0x15D59D
call = "ConkerScreenQuadDraw"

# kSpriteDraws: the sprite routines' DrawVerticesUP calls, single player's pause prompts' icons among them, for the mouse
[[hook]]
at = 0x356E21
call = "ConkerSpriteDraw"

[[hook]]
at = 0x3570D5
call = "ConkerSpriteDraw"

[[hook]]
at = 0x357303
call = "ConkerSpriteDraw"

[[hook]]
at = 0x35784D
call = "ConkerSpriteDraw"

[[hook]]
at = 0x357CE4
call = "ConkerSpriteDraw"

[[hook]]
at = 0x357F9A
call = "ConkerSpriteDraw"

[[hook]]
at = 0x3582AA
call = "ConkerSpriteDraw"

[[hook]]
at = 0x3585D6
call = "ConkerSpriteDraw"

[[hook]]
at = 0x3587C1
call = "ConkerSpriteDraw"

[[hook]]
at = 0x358958
call = "ConkerSpriteDraw"

[[hook]]
at = 0x358C87
call = "ConkerSpriteDraw"

[[hook]]
at = 0x359174
call = "ConkerSpriteDraw"

[[hook]]
at = 0x35957A
call = "ConkerSpriteDraw"

[[hook]]
at = 0x35988A
call = "ConkerSpriteDraw"

[[hook]]
at = 0x359DDA
call = "ConkerSpriteDraw"

# a match's weapon panel: its button icons as keys (menus.cpp), around 0x1CAD90's quad
[[hook]]
at = 0x1CB031  # about to draw it, its texture set
call = "ConkerHudQuad"

[[hook]]
at = 0x1CB052  # drawn, its corners still pushed
call = "ConkerHudQuadDrawn"

# a match's prompt of A ("exit" on a vehicle, 0x1C9DF0): its icon as the key (menus.cpp), around 0x1CAAA0's quad
[[hook]]
at = 0x1CAD60  # about to draw it, its texture set
call = "ConkerHudPromptQuad"

[[hook]]
at = 0x1CAD81  # drawn
call = "ConkerHudPromptQuadDrawn"

# the HUD's elements as scopes (display.cpp), for the HUD unstretched in a match
[[hook]]
at = 0x0D9AAF  # an effect layer's object drawn: ebx the layer, esi the object, ebp the routine
call = "ConkerHudLayerObject"

[[hook]]
at = 0x0D9AB1  # after it
call = "ConkerHudLayerObjectEnd"

[[hook]]
at = 0x1F2835  # a text entry made and linked: edx the entry
call = "ConkerHudTextMade"

[[hook]]
at = 0x1F2F7B  # a text entry about to be drawn: esi the entry
call = "ConkerHudTextEntry"

[[hook]]
at = 0x1F2FC3  # the entry done, drawn or skipped
call = "ConkerHudTextEntryEnd"

[[hook]]
at = 0x2888A8  # the host's SysFindR answer to a search: its 29 unused bits carry this build's token (link.cpp)
call = "ConkerLinkAdvertise"
after = true

[[hook]]
at = 0x291B6C  # the match configure page's rows, before Reset Defaults: Friendly Fire (friendly_fire.cpp)
call = "ConkerFriendlyFireRow"

[[hook]]
at = 0x245FC2  # a menu list row's label copied in: Friendly Fire's (friendly_fire.cpp)
call = "ConkerFriendlyFireLabel"

[[hook]]
at = 0x288D45  # a SysFindR kept in the session list: its token noted by the session's XNKID
call = "ConkerLinkSession"

# malformed packets in networklib's receive (0x419FA0): its message loop kept to the data that arrived (net_guard.cpp)
[[hook]]
at = 0x41A519  # the packet's length in bits: no more than the bytes received
call = "ConkerNetLength"

[[hook]]
at = 0x41A540  # the message loop's top: its exit when a type no longer fits (counted signed)
call = "ConkerNetLoop"
on_true = 0x41A6F8

[[hook]]
at = 0x41A55A  # the type read: its exit for a type past the factory table or with no factory
call = "ConkerNetType"
on_true = 0x41A6F8

[[hook]]
at = 0x41A68F  # the message read: deleted and the loop left when its reading ran past the packet
call = "ConkerNetRead"
on_true = 0x41A6F0

[[hook]]
at = 0x258BF7  # joining a system link session: refused unless its token matches this copy's
call = "ConkerLinkJoin"

[[hook]]
at = 0x27BC31  # JoinG's protocol version written: this build's (0 for a refused join) in place of 0x1D4
call = "ConkerLinkJoinVersion"

[[hook]]
at = 0x27C219  # the host's check of a JoinG's version: against this build's in place of 0x1D4
call = "ConkerLinkJoinCheck"

[[hook]]
at = 0x27CBF7  # a JoinD's notice: the key of its text about to be looked up (ecx)
call = "ConkerLinkDeniedKey"

[[hook]]
at = 0x27CBFE  # its text found (eax): "Wrong version" made the frame rate's when that was why this copy refused
call = "ConkerLinkDeniedText"

[[hook]]
at = 0x387FF7  # a jeep's or bike's AI drive (0x387FA0, esi the vehicle): the bearing past which it backs up, [esp+8], by the way it went last
call = "ConkerBotReverseJeep"

[[hook]]
at = 0x3AAB53  # the flame jeep's (0x3AAB00, ecx the vehicle): the same, at [esp]
call = "ConkerBotReverseFlameJeep"

# the medgun's beam (medbeam.cpp): drawn into each view after its world effects (0x0D9950, category 0)
[[hook]]
at = 0x2A52FA  # 0x0D9950 returned, [esp+4] the view
call = "ConkerMedBeams"
