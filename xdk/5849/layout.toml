# XDK 5849 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (Splinter Cell Double Agent) code at the address given; sc4_adv.xbe (same 5849 libraries) matches.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x49B112 reads it, compares with +4, calls MakeSpace 0x4A1740
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x49B115 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x49B2C9 stores BaseVertexIndex
CDevice_IndexBuffer   = 0x7A0   # D3DDevice_SetIndices 0x49B29A reads the old one, 0x49B2C2 stores the new one
CDevice_ZScale        = 0x948   # D3DDevice_GetViewportOffsetAndScale 0x49F114 scales the Z range by it
CDevice_SuperSampleX  = 0x95C   # D3DDevice_GetViewportOffsetAndScale 0x49F06E scales viewport X by it
CDevice_SuperSampleY  = 0x960   # D3DDevice_GetViewportOffsetAndScale 0x49F090 scales viewport Y by it
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform 0x49A476 copies 16 dwords to +0xC60 + type * 64
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture 0x49B0D0 reads, 0x49B109 stores [stage]
CDevice_RenderTarget  = 0x1A04  # D3DDevice_GetRenderTarget2 0x49AE56 returns it
CDevice_Depth         = 0x1A08  # D3DDevice_GetDepthStencilSurface2 0x49AE76 returns it
CDevice_BackBuffer    = 0x1A14  # D3DDevice_GetBackBuffer2 0x49AB00 returns it for index 0
CDevice_FrontBuffer   = 0x1A18  # D3DDevice_GetBackBuffer2 0x49AAE5 returns it for index -1
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap 0x49CCB0 increments it, 0x49CD29 returns it
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice 0x49D28B clears 0x928 dwords of the device on failure
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x49B147 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x49FA4B: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x49E9FA indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x49EA42 stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x49EA48 stores the vertex buffer
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor 0x4D0050 stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor 0x4D0049 stores the second vtable
EffectsImage_Skip0    = 0x804   # 0x4D1DA8 (reached from CDirectSound_DownloadEffectsImage 0x4CDB81) adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x4D1DA2 loads this dword count
EffectsImage_Desc     = 0x818   # 0x4D1DB1: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices 0x4EDAA0 returns it
XPP_Changed           = 0x4     # XGetDevices 0x4EDAA2 clears it, XGetDeviceChanges 0x4EDAC0 tests it
XPP_Previous          = 0x8     # XGetDevices 0x4EDAA8 copies Current into it
